<!-- Glassmorphism Card Gradient -->
<linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
  <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5"/>
</linearGradient>

<!-- Glowing Neon Gradients -->
<linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#00f0ff"/>
  <stop offset="50%" stop-color="#a855f7"/>
  <stop offset="100%" stop-color="#3b82f6"/>
</linearGradient>

<linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#22c55e"/>
  <stop offset="100%" stop-color="#10b981"/>
</linearGradient>

<linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
  <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
  <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
</linearGradient>

<!-- Cyber Grid Pattern -->
<pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.07"/>
</pattern>

<!-- Glow Filters -->
<filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="6" result="blur" />
  <feMerge>
    <feMergeNode in="blur" />
    <feMergeNode in="SourceGraphic" />
  </feMerge>
</filter>

<filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="10" result="blur" />
  <feMerge>
    <feMergeNode in="blur" />
    <feMergeNode in="SourceGraphic" />
  </feMerge>
</filter>

<filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
  <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
  <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f0ff" flood-opacity="0.2"/>
</filter>

<!-- Avatar Clip Path -->
<clipPath id="avatarCircle">
  <circle cx="740" cy="160" r="68" />
</clipPath>


<!-- Cyber Framing Accents -->
<path d="M 40 60 L 40 44 Q 40 30 54 30 L 80 30" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
<path d="M 820 30 L 846 30 Q 860 30 860 44 L 860 60" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
<path d="M 40 230 L 40 246 Q 40 260 54 260 L 80 260" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#glowPurple)"/>
<path d="M 860 230 L 860 246 Q 860 260 846 260 L 820 260" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#glowPurple)"/>

<!-- Left Content Column -->
<!-- Country Badge -->
<g transform="translate(70, 58)">
  <rect x="0" y="0" width="135" height="24" rx="12" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="14" cy="12" r="4" fill="#00f0ff" filter="url(#glowCyan)"/>
  <text x="26" y="16" fill="#00f0ff" font-size="11" font-weight="800" letter-spacing="1.5" class="tech-font">SRI LANKA 🇱🇰</text>
</g>

<!-- Primary Name Title -->
<text x="70" y="122" font-size="36" font-weight="900" fill="#ffffff" class="tech-font" letter-spacing="-0.5">
  MS Nihaaj Ahamed
</text>

<!-- Subtitle / Bio -->
<text x="70" y="152" font-size="15" font-weight="500" fill="#94a3b8" class="tech-font">
  IT Undergraduate <tspan fill="#00f0ff">|</tspan> <tspan fill="#f8fafc" font-weight="600">Solution Creator</tspan> <tspan fill="#00f0ff">|</tspan> AI &amp; Automation Engineer
</text>

<!-- Tech Badges -->
<g transform="translate(70, 180)">
  <!-- Badge 1: DevOps -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="110" height="32" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1"/>
    <text x="14" y="20" fill="#38bdf8" font-size="12" font-weight="700" class="tech-font">⚡ DevOps</text>
  </g>

  <!-- Badge 2: Software Engineer -->
  <g transform="translate(122, 0)">
    <rect x="0" y="0" width="160" height="32" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
    <text x="14" y="20" fill="#c084fc" font-size="12" font-weight="700" class="tech-font">⚙️ Software Engineer</text>
  </g>

  <!-- Badge 3: AI Architect -->
  <g transform="translate(294, 0)">
    <rect x="0" y="0" width="135" height="32" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1"/>
    <text x="14" y="20" fill="#60a5fa" font-size="12" font-weight="700" class="tech-font">🤖 AI Architect</text>
  </g>
</g>

<!-- Status Line -->
<path d="M 70 236 L 460 236" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
<circle cx="70" cy="236" r="3" fill="#22c55e" filter="url(#glowCyan)"/>
<text x="82" y="240" font-size="11" fill="#64748b" font-weight="600" class="tech-font" letter-spacing="1">
  SYSTEM STATUS: <tspan fill="#22c55e">ONLINE &amp; BUILDING</tspan>
</text>


<!-- Rotating HUD Outer Dash Ring -->
<circle class="rotate-outer" cx="740" cy="160" r="88" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" stroke-dasharray="14 10 4 10" filter="url(#glowCyan)"/>

<!-- Rotating Inner Tech Ring -->
<circle class="rotate-inner" cx="740" cy="160" r="78" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="35 15 8 15" filter="url(#glowPurple)"/>

<!-- Avatar Holographic Core Background -->
<circle cx="740" cy="160" r="68" fill="url(#avatarGlow)" opacity="0.25"/>

<!-- 3D Vector Cyber Avatar Icon (Guaranteed to render smoothly across all platforms) -->
<g clip-path="url(#avatarCircle)">
  <!-- Avatar Silhouette / Headset HUD -->
  <circle cx="740" cy="160" r="68" fill="#0f172a"/>
  <path d="M 740 115 A 32 32 0 0 1 772 147 L 772 165 Q 772 175 762 182 L 740 195 L 718 182 Q 708 175 708 165 L 708 147 A 32 32 0 0 1 740 115 Z" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3"/>
  
  <!-- User Head & Shoulders Silhouette -->
  <circle cx="740" cy="142" r="26" fill="url(#cyanPurple)"/>
  <path d="M 688 208 C 688 175, 712 172, 740 172 C 768 172, 792 175, 792 208 Z" fill="url(#cyanPurple)"/>
  
  <!-- Futuristic Glasses / HUD Visor -->
  <path d="M 722 138 L 758 138 L 754 146 L 726 146 Z" fill="#00f0ff" filter="url(#glowCyan)"/>
  <line x1="718" y1="140" x2="762" y2="140" stroke="#ffffff" stroke-width="1.5"/>
</g>

<!-- Glass Ring Border & Highlight Overlay -->
<circle cx="740" cy="160" r="68" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
<path d="M 680 130 A 68 68 0 0 1 800 130 Z" fill="rgba(255, 255, 255, 0.08)"/>

<!-- Floating Hologram Particles -->
<circle class="particle-1" cx="690" cy="200" r="2" fill="#00f0ff" filter="url(#glowCyan)"/>
<circle class="particle-2" cx="785" cy="190" r="2.5" fill="#a855f7" filter="url(#glowPurple)"/>
<circle class="particle-3" cx="750" cy="85" r="1.8" fill="#00f0ff"/>
