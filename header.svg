    @keyframes spinHolo {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes reverseSpin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.08); }
    }

    @keyframes cyberGrid {
      0% { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    @keyframes textShine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    @keyframes meteor {
      0% { transform: translateX(-200px) translateY(-200px); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(1000px) translateY(1000px); opacity: 0; }
    }

    .main-wrapper {
      width: 100%;
      height: 360px;
      background: #030712;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 240, 255, 0.15);
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.07) 1px, transparent 1px);
      background-size: 35px 35px;
      animation: cyberGrid 20s linear infinite;
      transform: transform: perspective(500px) rotateX(60deg);
      transform-origin: center top;
    }

    .ambient-glow-1 {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      top: -80px;
      left: -80px;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    .ambient-glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -100px;
      right: -100px;
      animation: pulseGlow 8s ease-in-out infinite 2s;
    }

    .scan-beam {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00f0ff, #8a2be2, transparent);
      box-shadow: 0 0 15px #00f0ff;
      animation: scanline 8s ease-in-out infinite;
      opacity: 0.7;
    }

    .card-3d {
      position: relative;
      z-index: 10;
      width: 92%;
      height: 82%;
      background: rgba(13, 17, 23, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 30px rgba(0, 240, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 45px;
      transform-style: preserve-3d;
      animation: float3D 7s ease-in-out infinite;
    }

    .content-left {
      max-width: 520px;
      z-index: 2;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00f0ff;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      margin-bottom: 14px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00f0ff;
      animation: pulseGlow 1.5s infinite;
    }

    .glitch-title {
      font-size: 34px;
      font-weight: 900;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, #00f0ff, #a855f7, #ffffff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 6s ease infinite;
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .subtitle {
      font-size: 15px;
      color: #94a3b8;
      margin: 0 0 20px 0;
      font-weight: 500;
      line-height: 1.5;
    }

    .subtitle span {
      color: #38bdf8;
      font-weight: 600;
    }

    .tags-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag-3d {
      padding: 7px 15px;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-3d:hover {
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    /* 3D Hologram Avatar Portal */
    .avatar-portal {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 240, 255, 0.6);
      animation: spinHolo 15s linear infinite;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    }

    .ring-inner {
      position: absolute;
      width: 85%;
      height: 85%;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #a855f7;
      border-bottom-color: #38bdf8;
      animation: reverseSpin 8s linear infinite;
    }

    .avatar-frame {
      position: relative;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      overflow: hidden;
      padding: 3px;
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #090d16;
    }

    .holo-glare {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Floating particles/icons */
    .tech-orb {
      position: absolute;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
    }
  </style>

  <div class="main-wrapper">
    <div class="grid-bg"></div>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="scan-beam"></div>

    <div class="card-3d">
      <div class="content-left">
        <div class="status-badge">
          <span class="status-dot"></span> SRI LANKA 🇱🇰
        </div>
        <h1 class="glitch-title">MS Nihaaj Ahamed</h1>
        <p class="subtitle">
          IT Undergraduate | <span>Solution Creator</span> | AI &amp; Automation Engineer
        </p>
        <div class="tags-container">
          <div class="tag-3d">⚡ DevOps</div>
          <div class="tag-3d">⚙️ Software Engineer</div>
          <div class="tag-3d">🤖 AI Architect</div>
        </div>
      </div>

      <div class="avatar-portal">
        <div class="ring-outer"></div>
        <div class="ring-inner"></div>
        <div class="avatar-frame">
          <img class="avatar-img" src="https://github.com/Nihaaj-Ahamed.png" alt="MS Nihaaj Ahamed" />
          <div class="holo-glare"></div>
        </div>
      </div>
    </div>
  </div>
</div>
